<!doctype html>
<meta charset="utf-8">
<title>Native tab protocol fixture</title>
<script>
// Transport the public native browser protocol; assertions stay in RSpec.
window.sapiensBrowserEvent = event => fetch('/event', {method:'POST', body:JSON.stringify(event)});
async function receive() {
  const command = await (await fetch('/command')).json();
  if (command) {
    window.webkit.messageHandlers.browser.postMessage(command.message);
    await new Promise(resolve => setTimeout(resolve, 100));
    await fetch('/ack', {method:'POST', body:String(command.serial)});
  }
  setTimeout(receive, 50);
}
receive();
</script>
