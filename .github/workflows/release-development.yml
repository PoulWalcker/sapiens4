name: Version tag Windows packages
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'PoulWalcker/sapiens4'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.tag.outputs.version }}
      source_commit: ${{ steps.tag.outputs.source_commit }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a version tag on main history
        id: tag
        shell: bash
        run: |
          git merge-base --is-ancestor HEAD origin/main
          python3 - <<'PYTHON'
          import os, re, subprocess
          tag = os.environ['GITHUB_REF_NAME']
          number = r'(?:0|[1-9][0-9]*)'
          prerelease = r'(?:0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)'
          build = r'[0-9A-Za-z-]+'
          version_pattern = (rf'v{number}\.{number}\.{number}'
                             rf'(?:-{prerelease}(?:\.{prerelease})*)?'
                             rf'(?:\+{build}(?:\.{build})*)?')
          if not re.fullmatch(version_pattern, tag):
              raise SystemExit('Expected vSemVer tag')
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('version=' + tag[1:] + '\nsource_commit=' + commit + '\n')
          PYTHON
  build:
    needs: prepare
    uses: ./.github/workflows/native-build.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      release: true
    secrets: inherit
