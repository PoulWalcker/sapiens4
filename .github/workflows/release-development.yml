name: Version tag Windows packages
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'PoulWalcker/sapiens4'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a version tag on main history
        id: tag
        shell: bash
        run: |
          git merge-base --is-ancestor HEAD origin/main
          number='(0|[1-9][0-9]*)'
          prerelease='(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)'
          metadata='[0-9A-Za-z-]+'
          pattern="^v$number\.$number\.$number(-$prerelease(\.$prerelease)*)?(\+$metadata(\.$metadata)*)?$"
          [[ "$GITHUB_REF_NAME" =~ $pattern ]] || { echo 'Expected vSemVer tag' >&2; exit 1; }
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    uses: ./.github/workflows/native-build.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      release: true
    secrets: inherit
