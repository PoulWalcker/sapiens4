name: Version tag releases
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'PoulWalcker/sapiens4'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.tag.outputs.version }}
      source_commit: ${{ steps.tag.outputs.source_commit }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a version tag on main history
        id: tag
        shell: bash
        run: |
          git merge-base --is-ancestor HEAD origin/main
          python3 - <<'PYTHON'
          import os, re, subprocess
          tag = os.environ['GITHUB_REF_NAME']
          if not re.fullmatch(r'v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?', tag):
              raise SystemExit('Expected vSemVer tag')
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('version=' + tag[1:] + '\nsource_commit=' + commit + '\n')
          PYTHON
  build:
    needs: prepare
    uses: ./.github/workflows/native-build.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      release: true
    secrets: inherit
  publish:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify both signed assets, then publish the complete release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_COMMIT: ${{ needs.prepare.outputs.source_commit }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'sapiens4-development-*' --dir release-assets
          python3 build/package/release.py --repository "$GITHUB_REPOSITORY" --directory release-assets --source-commit "$SOURCE_COMMIT" --version "$RELEASE_VERSION" --output verified-assets.txt
          mapfile -t assets < verified-assets.txt
          release_args=(--draft --generate-notes)
          if [[ "${RELEASE_VERSION%%+*}" == *-* ]]; then release_args+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --target "$SOURCE_COMMIT" --verify-tag --title "Sapiens4 Development $RELEASE_VERSION" "${release_args[@]}"
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
