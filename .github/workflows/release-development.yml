name: Version tag releases
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'PoulWalcker/sapiens4'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.tag.outputs.version }}
      source_commit: ${{ steps.tag.outputs.source_commit }}
      test_release: ${{ steps.tag.outputs.test_release }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate version tag and allowed source history
        id: tag
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import os, re, subprocess
          tag = os.environ['GITHUB_REF_NAME']
          number = r'(?:0|[1-9][0-9]*)'
          prerelease = r'(?:0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)'
          build = r'[0-9A-Za-z-]+'
          version_pattern = (rf'v{number}\.{number}\.{number}'
                             rf'(?:-{prerelease}(?:\.{prerelease})*)?'
                             rf'(?:\+{build}(?:\.{build})*)?')
          if not re.fullmatch(version_pattern, tag):
              raise SystemExit('Expected vSemVer tag')
          test_release = bool(re.fullmatch(r'v(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)-dev\.release-check\.[1-9][0-9]*', tag))
          allowed = 'origin/codex/verify-clean-composition' if test_release else 'origin/main'
          subprocess.run(['git', 'merge-base', '--is-ancestor', 'HEAD', allowed], check=True)
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('version=' + tag[1:] + '\nsource_commit=' + commit + '\ntest_release=' + str(test_release).lower() + '\n')
          PYTHON
  build:
    needs: prepare
    uses: ./.github/workflows/native-build.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      release: ${{ needs.prepare.outputs.test_release != 'true' }}
    secrets: inherit
  publish:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify both platform assets, then publish the complete release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          TEST_RELEASE: ${{ needs.prepare.outputs.test_release }}
          SOURCE_COMMIT: ${{ needs.prepare.outputs.source_commit }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'sapiens4-development-*' --dir release-assets
          verification_args=()
          if [[ "$TEST_RELEASE" == true ]]; then verification_args+=(--test-release); fi
          python3 build/package/release.py --repository "$GITHUB_REPOSITORY" --directory release-assets --source-commit "$SOURCE_COMMIT" --version "$RELEASE_VERSION" --output verified-assets.txt "${verification_args[@]}"
          mapfile -t assets < verified-assets.txt
          release_args=(--draft --generate-notes)
          if [[ "${RELEASE_VERSION%%+*}" == *-* ]]; then release_args+=(--prerelease); fi
          if [[ "$TEST_RELEASE" == true ]]; then
            printf '%s\n' 'Test prerelease: macOS ad-hoc signed; Windows unsigned. For isolated testing only. Source: '"$SOURCE_COMMIT" > release-notes.txt
            release_args+=(--notes-file release-notes.txt)
          fi
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --target "$SOURCE_COMMIT" --verify-tag --title "Sapiens4 Development $RELEASE_VERSION" "${release_args[@]}"
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
