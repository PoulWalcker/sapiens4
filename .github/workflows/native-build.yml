name: Native verification and test packages
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Test artifact SemVer (selected branch; no release publication)
        default: 0.1.0-dev
        required: true
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      release:
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('native-manual-{0}', github.run_id) || format('native-{0}-{1}', github.ref, github.event_name) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: darwin-arm64
            compile: ./environments/macos/build.sh --build-only
          - runner: windows-2025
            platform: windows-x64
            compile: pwsh -NoProfile -File ./environments/windows/build.ps1 -BuildOnly
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      PACKAGE_VERSION: ${{ inputs.version || '0.1.0-dev' }}
      PROVIDER_PLATFORM: ${{ matrix.platform }}
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check release signing prerequisites before expensive builds
        if: inputs.release
        shell: python
        env:
          MAC_CERTIFICATE_P12: ${{ secrets.MAC_CERTIFICATE_P12 }}
          MAC_SIGN_IDENTITY: ${{ secrets.MAC_SIGN_IDENTITY }}
          MAC_NOTARY_KEY_P8: ${{ secrets.MAC_NOTARY_KEY_P8 }}
          MAC_NOTARY_KEY_ID: ${{ secrets.MAC_NOTARY_KEY_ID }}
          MAC_NOTARY_ISSUER: ${{ secrets.MAC_NOTARY_ISSUER }}
          WINDOWS_CERTIFICATE_PFX: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          import os
          if os.environ['GITHUB_EVENT_NAME'] != 'push' or os.environ['GITHUB_REPOSITORY'] != 'PoulWalcker/sapiens4' or os.environ['GITHUB_REF'] != 'refs/tags/v' + os.environ['PACKAGE_VERSION']:
              raise SystemExit('Release signing is restricted to version-tag calls')
          names = (['MAC_CERTIFICATE_P12', 'MAC_SIGN_IDENTITY', 'MAC_NOTARY_KEY_P8', 'MAC_NOTARY_KEY_ID', 'MAC_NOTARY_ISSUER']
                   if os.environ['PROVIDER_PLATFORM'] == 'darwin-arm64' else ['WINDOWS_CERTIFICATE_PFX', 'WINDOWS_CERTIFICATE_PASSWORD'])
          missing = [name for name in names if not os.environ.get(name)]
          if missing:
              raise SystemExit('Missing signing configuration: ' + ', '.join(missing))
      - name: Resolve exact dependency pins from upstream URLs
        shell: bash
        run: |
          git config submodule.blindly4.url https://github.com/aleski-green/blindly4.git
          git config submodule.libs4.url https://github.com/aleski-green/libs4.git
          git submodule update --init --recursive
          git submodule status --recursive
      - uses: haskell-actions/setup@82e8b5066385702e477d9dc98f287070493e8abd # v2.8.2, peeled commit
        with:
          ghc-version: '9.14.1'
          cabal-version: '3.18.2.0'
          cabal-update: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.2'
      - name: Verify Windows UI tools before application compilation
        if: runner.os == 'Windows'
        timeout-minutes: 10
        shell: pwsh
        run: ./build/windows-ui-preflight.ps1
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup override set 1.99.0
      - name: Configure isolated HTTPS Hackage index
        shell: python
        run: |
          from pathlib import Path
          root = Path('submodules/libs4/haskell/.cabal')
          root.mkdir(parents=True, exist_ok=True)
          (root / 'config').write_text('repository hackage.haskell.org\n  url: https://hackage.haskell.org/\n  secure: True\n')
      - name: Key isolated Cabal dependencies
        id: cabal-key
        if: github.repository == 'PoulWalcker/sapiens4' && github.event_name != 'pull_request'
        shell: bash
        run: python build/package/cabal-cache.py key
      - name: Restore trusted Cabal dependencies
        id: cabal-restore
        if: github.repository == 'PoulWalcker/sapiens4' && github.event_name != 'pull_request'
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          key: ${{ steps.cabal-key.outputs.key }}
          path: |
            submodules/libs4/haskell/.cabal/store
            submodules/libs4/haskell/.cabal/packages
      - name: Compile installer script before the expensive Windows application build
        if: github.event_name != 'pull_request' && runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path .build/installer-script-input -Force | Out-Null
          Set-Content -LiteralPath .build/installer-script-input/Sapiens4.exe -Value 'compiler fixture only'
          Set-Content -LiteralPath .build/installer-script-input/sapiens-installation.id -Value 'com.poulwalcker.sapiens4.development'
          ./build/package/windows-installer.ps1 -PackageDirectory .build/installer-script-input -OutputDirectory .build/installer-script-output -Version $env:PACKAGE_VERSION -CertificateThumbprint ([string]::Empty)
          if ($LASTEXITCODE -ne 0) { throw 'Installer script/compiler preflight failed' }
      - name: Compile host, native application, UI and existing fixture helpers once
        id: compile
        shell: bash
        run: ${{ matrix.compile }}
      - name: Check completed dependencies even if UI compilation failed
        id: cabal-ready
        if: ${{ !cancelled() && github.repository == 'PoulWalcker/sapiens4' && github.event_name != 'pull_request' && steps.compile.outcome != 'skipped' && steps.cabal-restore.outputs.cache-hit != 'true' }}
        shell: bash
        run: python build/package/cabal-cache.py check
      - name: Save verified Cabal dependencies before packaging
        if: ${{ !cancelled() && steps.cabal-ready.outputs.ready == 'true' }}
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          key: ${{ steps.cabal-key.outputs.key }}
          path: |
            submodules/libs4/haskell/.cabal/store
            submodules/libs4/haskell/.cabal/packages
      # Pull requests stop at compilation: no provider download, package or upload.
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1 snapshot, 2026-11-08
        if: github.event_name != 'pull_request'
        with:
          ruby-version: '3.4.11'
      - name: Install package-scenario dependencies
        if: github.event_name != 'pull_request'
        shell: bash
        run: ruby submodules/libs4/ruby/bundle.rb install
      - name: Configure macOS release signing and notarization
        if: inputs.release && runner.os == 'macOS'
        shell: bash
        env:
          MAC_CERTIFICATE_P12: ${{ secrets.MAC_CERTIFICATE_P12 }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          MAC_SIGN_IDENTITY: ${{ secrets.MAC_SIGN_IDENTITY }}
          MAC_NOTARY_KEY_P8: ${{ secrets.MAC_NOTARY_KEY_P8 }}
          MAC_NOTARY_KEY_ID: ${{ secrets.MAC_NOTARY_KEY_ID }}
          MAC_NOTARY_ISSUER: ${{ secrets.MAC_NOTARY_ISSUER }}
        run: |
          : "${MAC_CERTIFICATE_P12:?Missing Mac certificate}" "${MAC_SIGN_IDENTITY:?Missing Mac signing identity}"
          : "${MAC_NOTARY_KEY_P8:?Missing notary key}" "${MAC_NOTARY_KEY_ID:?Missing notary key ID}" "${MAC_NOTARY_ISSUER:?Missing issuer}"
          umask 077
          python3 - <<'PYTHON'
          import base64, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          (root / 'sapiens-release.p12').write_bytes(base64.b64decode(os.environ['MAC_CERTIFICATE_P12'], validate=True))
          (root / 'sapiens-notary.p8').write_bytes(base64.b64decode(os.environ['MAC_NOTARY_KEY_P8'], validate=True))
          PYTHON
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          KEYCHAIN="$RUNNER_TEMP/sapiens-release.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/sapiens-release.p12" -P "$MAC_CERTIFICATE_PASSWORD" -k "$KEYCHAIN" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          xcrun notarytool store-credentials sapiens-release --key "$RUNNER_TEMP/sapiens-notary.p8" --key-id "$MAC_NOTARY_KEY_ID" --issuer "$MAC_NOTARY_ISSUER"
      - name: Configure Windows release signing
        if: inputs.release && runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PFX: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE_PFX -or -not $env:WINDOWS_CERTIFICATE_PASSWORD) { throw 'Windows signing secrets required' }
          $pfx = Join-Path $env:RUNNER_TEMP 'sapiens-release.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificates = @(Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password | Where-Object HasPrivateKey)
          if ($certificates.Count -ne 1) { throw 'Expected one signing certificate with a private key' }
          "SAPIENS_WINDOWS_CERT_THUMBPRINT=$($certificates[0].Thumbprint)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object { [Version]$_.Directory.Parent.Name } -Descending | Select-Object -First 1
          if (-not $signTool) { throw 'Windows SDK SignTool required' }
          $signTool.DirectoryName | Out-File $env:GITHUB_PATH -Append -Encoding utf8
      - name: Package and verify macOS without recompiling
        if: github.event_name != 'pull_request' && runner.os == 'macOS'
        shell: bash
        env:
          SAPIENS_MAC_SIGN_IDENTITY: ${{ inputs.release && secrets.MAC_SIGN_IDENTITY || '-' }}
          SAPIENS_MAC_NOTARY_PROFILE: ${{ inputs.release && 'sapiens-release' || '' }}
        run: |
          ./environments/macos/build.sh --skip-build --version "$PACKAGE_VERSION" --output-directory .build/distribution
          SAPIENS_TEST_PACKAGE_RUNTIME="$PWD/.build/distribution/Sapiens4 Development.app/Contents/Resources/runtime" ruby submodules/libs4/ruby/bundle.rb exec rspec spec/native_package_spec.rb
      - name: Package and verify Windows without recompiling
        if: github.event_name != 'pull_request' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $thumbprint = if ('${{ inputs.release }}' -eq 'true') { $env:SAPIENS_WINDOWS_CERT_THUMBPRINT } else { [string]::Empty }
          ./environments/windows/build.ps1 -SkipBuild -Runtime win-x64 -Version $env:PACKAGE_VERSION -OutputDirectory .build/distribution -CertificateThumbprint $thumbprint
          if ($LASTEXITCODE -ne 0) { throw 'Package build failed' }
          $env:SAPIENS_TEST_PACKAGE_RUNTIME = (Resolve-Path .build/distribution/Sapiens4-Development-win-x64/runtime).Path
          ruby submodules/libs4/ruby/bundle.rb exec rspec spec/native_package_spec.rb
          if ($LASTEXITCODE -ne 0) { throw 'Package scenario failed' }
      - name: Verify per-user Windows install, native launch and uninstall
        if: github.event_name != 'pull_request' && runner.os == 'Windows'
        shell: pwsh
        run: ./build/package/windows-installer-check.ps1 -Installer .build/distribution/Sapiens-Setup.exe -EvidenceDirectory .build/distribution/installer-check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && github.event_name != 'pull_request'
        with:
          name: sapiens4-development-${{ matrix.platform }}
          path: |
            .build/distribution/Sapiens.dmg
            .build/distribution/Sapiens-Setup.exe
            .build/distribution/*.zip
            .build/distribution/*.release.json
            .build/distribution/installer-check/*
          if-no-files-found: error
      - name: Remove temporary macOS signing material
        if: always() && inputs.release && runner.os == 'macOS'
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/sapiens-release.keychain-db" || true
          rm -f "$RUNNER_TEMP/sapiens-release.p12" "$RUNNER_TEMP/sapiens-notary.p8"
      - name: Remove temporary Windows signing material
        if: always() && inputs.release && runner.os == 'Windows'
        shell: pwsh
        run: |
          if ($env:SAPIENS_WINDOWS_CERT_THUMBPRINT) { Remove-Item "Cert:\CurrentUser\My\$env:SAPIENS_WINDOWS_CERT_THUMBPRINT" -ErrorAction SilentlyContinue }
          Remove-Item (Join-Path $env:RUNNER_TEMP 'sapiens-release.pfx') -ErrorAction SilentlyContinue
