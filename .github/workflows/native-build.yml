name: Native verification and test packages
on:
  workflow_dispatch:
    inputs:
      version:
        description: Test artifact SemVer (select dev/distribution-integration)
        default: 0.1.0-dev
        required: true
permissions:
  contents: read
jobs:
  select-build-branch:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo '::error::Select dev/distribution-integration in Run workflow to build test installers. Main contains only this launcher; it has no application changes.'
          exit 1
