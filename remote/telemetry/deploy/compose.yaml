services:
  collector:
    image: ${TELEMETRY_IMAGE:?Set the built collector image}
    network_mode: host
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0
    pids_limit: 64
    ulimits:
      nofile: {soft: 1024, hard: 1024}
    environment:
      TELEMETRY_MAX_INFLIGHT: ${TELEMETRY_MAX_INFLIGHT:?Set the collector concurrency limit}
      TELEMETRY_MAX_HEADER_BYTES: ${TELEMETRY_MAX_HEADER_BYTES:?Set the collector header byte limit}
    volumes:
      - type: bind
        source: ${TELEMETRY_DATA_ROOT:?Set a new private V2 dataset root owned by UID 10001}
        target: /data
        bind: {create_host_path: false}
      # Close ingress and stop every old collector before changing this complete
      # active/previous/revocation configuration. Never mix policy generations.
      - type: bind
        source: ${TELEMETRY_AUTH_CONFIG:?Set the private complete auth configuration owned by UID 10001}
        target: /run/secrets/auth.json
        read_only: true
        bind: {create_host_path: false}
    logging:
      driver: local
      options: {max-size: 1m, max-file: "3"}
  ingress:
    image: ${TELEMETRY_INGRESS_IMAGE:?Set a pinned nginx-unprivileged image}
    depends_on: [collector]
    network_mode: host
    read_only: true
    user: "101:101"
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    mem_limit: ${TELEMETRY_INGRESS_MEMORY:?Set the ingress memory limit}
    memswap_limit: ${TELEMETRY_INGRESS_MEMORY:?Set the ingress memory limit}
    cpus: ${TELEMETRY_INGRESS_CPUS:?Set the ingress CPU limit}
    pids_limit: 64
    tmpfs: ["/tmp:size=32m,uid=101,gid=101,mode=0700"]
    command: [nginx, -c, /tmp/nginx.conf, -g, "daemon off;"]
    environment:
      NGINX_ENVSUBST_OUTPUT_DIR: /tmp
      NGINX_ENVSUBST_FILTER: ^TELEMETRY_
      TELEMETRY_SERVER_NAME: ${TELEMETRY_SERVER_NAME:?Set the TLS server name}
      TELEMETRY_HTTPS_PORT: ${TELEMETRY_HTTPS_PORT:?Set the public HTTPS port}
      TELEMETRY_WORKER_CONNECTIONS: ${TELEMETRY_WORKER_CONNECTIONS:?Set the total socket bound}
      TELEMETRY_HEADER_TIMEOUT: ${TELEMETRY_HEADER_TIMEOUT:?Set the header deadline}
      TELEMETRY_BODY_TIMEOUT: ${TELEMETRY_BODY_TIMEOUT:?Set the body inactivity deadline}
      TELEMETRY_PROXY_TIMEOUT: ${TELEMETRY_PROXY_TIMEOUT:?Set the proxy deadline}
      TELEMETRY_KEEPALIVE_TIMEOUT: ${TELEMETRY_KEEPALIVE_TIMEOUT:?Set the idle deadline}
      TELEMETRY_HEADER_BUFFER_SIZE: ${TELEMETRY_HEADER_BUFFER_SIZE:?Set the header buffer byte bound}
      TELEMETRY_HEADER_BUFFERS: ${TELEMETRY_HEADER_BUFFERS:?Set the header buffer count}
      TELEMETRY_LIMIT_ZONE_SIZE: ${TELEMETRY_LIMIT_ZONE_SIZE:?Set each limiter memory bound}
      TELEMETRY_CREDENTIALS_IP_RATE: ${TELEMETRY_CREDENTIALS_IP_RATE:?Set the enrollment IP rate}
      TELEMETRY_CREDENTIALS_GLOBAL_RATE: ${TELEMETRY_CREDENTIALS_GLOBAL_RATE:?Set the enrollment global rate}
      TELEMETRY_EVENTS_IP_RATE: ${TELEMETRY_EVENTS_IP_RATE:?Set the events IP rate}
      TELEMETRY_EVENTS_GLOBAL_RATE: ${TELEMETRY_EVENTS_GLOBAL_RATE:?Set the events global rate}
      TELEMETRY_REQUEST_BURST: ${TELEMETRY_REQUEST_BURST:?Set the finite request burst}
      TELEMETRY_CONNECTIONS_PER_IP: ${TELEMETRY_CONNECTIONS_PER_IP:?Set the per-IP active request bound}
      TELEMETRY_CONNECTIONS_GLOBAL: ${TELEMETRY_CONNECTIONS_GLOBAL:?Set the global active request bound}
    volumes:
      - type: bind
        source: ./nginx.conf.template
        target: /etc/nginx/templates/nginx.conf.template
        read_only: true
      - type: bind
        source: ${TELEMETRY_TLS_ROOT:?Set the private fullchain.pem and privkey.pem directory readable by UID 101}
        target: /run/tls
        read_only: true
        bind: {create_host_path: false}
    logging:
      driver: local
      options: {max-size: 1m, max-file: "3"}
