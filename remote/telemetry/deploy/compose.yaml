services:
  collector:
    image: ${TELEMETRY_IMAGE:?Set the built collector image}
    network_mode: host
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0
    pids_limit: 64
    ulimits:
      nofile: {soft: 1024, hard: 1024}
    environment:
      TELEMETRY_MAX_INFLIGHT: ${TELEMETRY_MAX_INFLIGHT:?Set the collector concurrency limit}
      TELEMETRY_MAX_HEADER_BYTES: ${TELEMETRY_MAX_HEADER_BYTES:?Set the collector header byte limit}
    volumes:
      - type: bind
        source: ${TELEMETRY_DATA_ROOT:?Set a new private V2 dataset root owned by UID 10001}
        target: /data
        bind: {create_host_path: false}
      - type: bind
        source: ${TELEMETRY_AUTH_CONFIG:?Set the private complete auth configuration owned by UID 10001}
        target: /run/secrets/auth.json
        read_only: true
        bind: {create_host_path: false}
    logging:
      driver: local
      options: {max-size: 1m, max-file: "3"}
